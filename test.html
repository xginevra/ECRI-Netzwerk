<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECRI-Netzwerk</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #f0f2f5;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* TOPBAR */
#topbar {
  background: #1a2b4a;
  color: #fff;
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  z-index: 1000;
}
#topbar h1 { font-size: 1rem; margin-right: auto; }

/* MAIN */
#main {
  position: relative;
  flex: 1;
}
#map {
  width: 100%;
  height: 100%;
}

/* FLOATING LIST */
#list {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 320px;
  max-height: calc(100% - 40px);
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  overflow-y: auto;
  padding: 12px;
  z-index: 1000;
}

/* CARD */
.list-item {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid #eee;
  cursor: pointer;
  transition: 0.2s;
}
.list-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}
.list-item.active {
  border-color: #3a6fd8;
  box-shadow: 0 0 0 2px rgba(58,111,216,0.2);
}
.list-name {
  font-weight: 600;
  color: #1a2b4a;
}
.list-meta {
  font-size: 0.75rem;
  color: #666;
  margin-top: 4px;
}

/* DETAIL PANEL */
#detail-panel {
  position: fixed;
  right: -360px;
  top: 0;
  width: 340px;
  height: 100%;
  background: #fff;
  box-shadow: -4px 0 16px rgba(0,0,0,0.18);
  transition: 0.25s;
  padding: 20px;
  z-index: 2000;
  overflow-y: auto;
}
#detail-panel.open { right: 0; }

#detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  z-index: 1999;
}
#detail-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.panel-title {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: #1a2b4a;
}

.panel-section {
  margin-bottom: 16px;
}

.panel-section h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 6px;
}

.panel-row {
  font-size: 0.9rem;
  margin-bottom: 5px;
  color: #333;
}

.panel-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.panel-badge {
  padding: 4px 10px;
  border-radius: 12px;
  background: #eef1f5;
  font-size: 0.75rem;
}

.panel-badge.active {
  background: #1a2b4a;
  color: #fff;
}
</style>
</head>

<body>

<div id="topbar">
  <h1>🏢 ECRI-Netzwerk</h1>
  <input id="search-input" placeholder="Suche...">
  <button id="reset-btn">Reset</button>
  <span id="result-count"></span>
</div>

<div id="main">
  <div id="map"></div>
  <div id="list"></div>
</div>

<div id="detail-overlay"></div>
<div id="detail-panel"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */
const db = supabase.createClient(
  "https://gmvodditiwpjlmjvrvec.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtdm9kZGl0aXdwamxtanZydmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1OTMxMzUsImV4cCI6MjA5NzE2OTEzNX0.DeZ-S9xsehxaYSzRnDMqSKAVaNp38xzYJg45fqlG6D8"
);

/* MAP */
const map = L.map('map').setView([48.56, 13.43], 9);

const voyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

L.control.layers({ "Voyager": voyager, "OSM": osm }).addTo(map);

/* STATE */
let allData = [];
let activeMarkers = [];

/* SEARCH */
function matchesSearch(c, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return Object.values(c).some(v => v && String(v).toLowerCase().includes(q));
}

/* POPUP */
function buildPopup(c, i) {
  return `<b>${c["Unternehmen"]}</b><br>${c["Adresse"] ?? ""}`;
}

/* PANEL */
function openDetailPanel(index) {
  const c = allData[index];

  // Helfer (falls leer → weg)
  const show = (label, value, icon="") =>
    value
      ? `<div class="panel-row"><span>${icon}</span><span>${value}</span></div>`
      : "";

  const split = (val) =>
    val ? val.split(";").map(v => v.trim()).filter(Boolean) : [];

  const badges = (arr) =>
    arr.map(v => `<span class="panel-badge">${v}</span>`).join("");

  document.getElementById("detail-panel").innerHTML = `

    <h2 class="panel-title">${c["Unternehmen"]}</h2>

    ${c["Branche"] ? `
      <div class="panel-section">
        <h3>Branche</h3>
        <div class="panel-badges">
          ${c["Branche"].split("/").map(b => `<span class="panel-badge active">${b}</span>`).join("")}
        </div>
      </div>` : ""}

    <div class="panel-section">
      <h3>Kontakt</h3>
      ${show("", c["Adresse"] || c["Standorte"], "📍")}
      ${show("", c["Telefon"], "📞")}
      ${c["EMail"] ? `<div class="panel-row">✉️ <a href="mailto:${c["EMail"]}">${c["EMail"]}</a></div>` : ""}
      ${c["Webseite"] ? `<div class="panel-row">🌐 <a href="https://${c["Webseite"]}" target="_blank">${c["Webseite"]}</a></div>` : ""}
      ${show("", c["Kontaktperson"], "👤")}
      ${show("", c["Erreichbarkeit"], "📶")}
    </div>

    ${c["Standorte"] ? `
    <div class="panel-section">
      <h3>Standorte</h3>
      <div class="panel-badges">
        ${badges(split(c["Standorte"]))}
      </div>
    </div>` : ""}

    ${c["Gesuchte Fachbereiche und Studiengänge"] ? `
    <div class="panel-section">
      <h3>Fachbereiche</h3>
      <div class="panel-badges">
        ${badges(split(c["Gesuchte Fachbereiche und Studiengänge"]))}
      </div>
    </div>` : ""}

    <div class="panel-section">
      <h3>Möglichkeiten</h3>
      <div class="panel-badges">
        ${c["Praktika ECRI"] === "X" ? `<span class="panel-badge active">Praktika</span>` : ""}
        ${c["BA-/MA-Thesis"] === "X" ? `<span class="panel-badge active">Thesis</span>` : ""}
        ${c["Duales Studium"] === "X" ? `<span class="panel-badge active">Duales Studium</span>` : ""}
        ${c["Auslandseinsatz"] === "X" ? `<span class="panel-badge active">Auslandseinsatz</span>` : ""}
        ${c["Messe DEG"] === "X" ? `<span class="panel-badge active">Messe DEG</span>` : ""}
        ${c["Messe ECRI"] === "X" ? `<span class="panel-badge active">Messe ECRI</span>` : ""}
      </div>
    </div>

    ${c["MA"] ? `
    <div class="panel-section">
      <h3>Mitarbeitende</h3>
      <div class="panel-row">👥 ${c["MA"]}</div>
    </div>` : ""}

    ${c["Kontakt / eigene Suche"] ? `
    <div class="panel-section">
      <h3>Notizen</h3>
      <div class="panel-row">📝 ${c["Kontakt / eigene Suche"]}</div>
    </div>` : ""}

  `;

  document.getElementById("detail-panel").classList.add("open");
  document.getElementById("detail-overlay").classList.add("open");
}
``

/* LIST */
function renderList(data) {
  const el = document.getElementById("list");

  el.innerHTML = data.map(c => `
    <div class="list-item"
      onclick="focusCompany(${c.index})"
      onmouseenter="highlightMarker(${c.index})"
      onmouseleave="resetMarkerHighlight()">
      
      <div class="list-name">${c["Unternehmen"]}</div>
      <div class="list-meta">${c["Adresse"] ?? ""}</div>

    </div>
  `).join("");
}

/* HIGHLIGHT */
function highlightMarker(i){
  activeMarkers.forEach(m=>{
    m.setOpacity(m._i===i?1:0.3);
    m.setZIndexOffset(m._i===i?1000:0);
  });
}
function resetMarkerHighlight(){
  activeMarkers.forEach(m=>m.setOpacity(1));
}

/* FOCUS */
window.focusCompany = function(i){
  document.querySelectorAll('.list-item').forEach(e=>e.classList.remove('active'));
  const el = document.querySelectorAll('.list-item')[i];
  if(el) el.classList.add('active');

  const c = allData[i];
  const lat = parseFloat(c.latitude);
  const lng = parseFloat(c.longitude);

  if(!isNaN(lat)) map.setView([lat,lng],13);

  openDetailPanel(i);
};

/* RENDER */
function render(){

  const q = document.getElementById("search-input").value;

  activeMarkers.forEach(m=>map.removeLayer(m));
  activeMarkers=[];

  const filtered=[];

  allData.forEach((c,i)=>{
    if(!matchesSearch(c,q)) return;

    const lat=parseFloat(c.latitude);
    const lng=parseFloat(c.longitude);
    if(isNaN(lat)) return;

    filtered.push({...c,index:i});

    const marker=L.marker([lat,lng])
      .addTo(map)
      .bindPopup(buildPopup(c,i));

    marker._i=i;
    activeMarkers.push(marker);
  });

  renderList(filtered);
  document.getElementById("result-count").innerText=filtered.length+" Unternehmen";
}

/* EVENTS */
document.getElementById("search-input").addEventListener("input", render);
document.getElementById("reset-btn").onclick=()=>{
  document.getElementById("search-input").value="";
  render();
};

/* LOAD */
async function load(){
  const {data}=await db.from("Unternehmen_neu").select("*");
  allData=data;
  render();
}
load();

</script>

</body>
</html>
