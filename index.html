<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unternehmenskarte</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top Bar ── */
    #topbar {
      background: #1a2b4a;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    #topbar h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
      margin-right: 4px;
    }

    #search-input {
      flex: 1;
      min-width: 180px;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      background: #ffffff18;
      color: #fff;
      outline: none;
      transition: background 0.2s;
    }
    #search-input::placeholder { color: #ffffffaa; }
    #search-input:focus { background: #ffffff28; }

    .filter-select {
      padding: 7px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      background: #ffffff18;
      color: #fff;
      outline: none;
      cursor: pointer;
      min-width: 140px;
      transition: background 0.2s;
    }
    .filter-select:focus { background: #ffffff28; }
    .filter-select option { background: #1a2b4a; color: #fff; }

    #reset-btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1.5px solid #ffffff55;
      background: transparent;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #reset-btn:hover { background: #ffffff18; }

    #result-count {
      font-size: 0.8rem;
      color: #ffffffaa;
      white-space: nowrap;
      margin-left: auto;
    }

    /* ── Badge-Filter Dropdown ── */
    .badge-filter-wrap {
      position: relative;
    }

    #badge-filter-btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      background: #ffffff18;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #badge-filter-btn:hover { background: #ffffff28; }
    #badge-filter-btn.has-selection {
      background: #3a6fd8;
    }

    #badge-filter-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #fff;
      color: #222;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      padding: 12px;
      width: 260px;
      z-index: 1500;
    }
    #badge-filter-dropdown.open { display: block; }

    .badge-filter-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      font-size: 0.78rem;
      color: #666;
    }
    .badge-filter-toggle-btn {
      display: flex;
      border: 1px solid #ccc;
      border-radius: 14px;
      overflow: hidden;
    }
    .badge-filter-toggle-btn button {
      border: none;
      background: #fff;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #888;
    }
    .badge-filter-toggle-btn button.active {
      background: #1a2b4a;
      color: #fff;
    }

    .badge-filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 2px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .badge-filter-option:hover { background: #f5f6f8; }
    .badge-filter-option input { cursor: pointer; }

    /* ── Map ── */
    #map {
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* ── Popup ── */
    .popup-inner {
      min-width: 220px;
      max-width: 280px;
      line-height: 1.5;
      font-size: 0.88rem;
    }
    .popup-inner .popup-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1a2b4a;
      margin-bottom: 3px;
    }
    .popup-inner .popup-branche {
      display: inline-block;
      background: #e8f0fe;
      color: #1a2b4a;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }
    .popup-inner .popup-row {
      display: flex;
      gap: 6px;
      margin-bottom: 3px;
      color: #444;
    }
    .popup-inner .popup-row span:first-child { flex-shrink: 0; }
    .popup-inner a { color: #1a6bbf; text-decoration: none; }
    .popup-inner a:hover { text-decoration: underline; }

    .popup-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 8px 0;
    }
    .popup-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: #f0f0f0;
      color: #555;
      white-space: nowrap;
    }
    .popup-badge.active {
      background: #1a2b4a;
      color: #fff;
    }

    .popup-more-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      border: 1.5px solid #1a2b4a;
      border-radius: 6px;
      background: #fff;
      color: #1a2b4a;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .popup-more-btn:hover { background: #f0f4fa; }

    /* ── Detail Panel ── */
    #detail-panel {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      max-width: 100vw;
      height: 100%;
      background: #fff;
      box-shadow: -4px 0 16px rgba(0,0,0,0.18);
      z-index: 2000;
      transition: right 0.25s ease;
      overflow-y: auto;
      padding: 20px;
    }
    #detail-panel.open { right: 0; }

    #detail-panel .panel-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border: none;
      background: #f0f2f5;
      border-radius: 50%;
      font-size: 1.1rem;
      color: #444;
      cursor: pointer;
      line-height: 1;
    }
    #detail-panel .panel-close:hover { background: #e2e5ea; }

    #detail-panel .panel-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a2b4a;
      margin: 6px 36px 4px 0;
    }
    #detail-panel .panel-branche {
      display: inline-block;
      background: #e8f0fe;
      color: #1a2b4a;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }

    .panel-section {
      margin-bottom: 18px;
    }
    .panel-section h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      margin-bottom: 8px;
    }
    .panel-row {
      display: flex;
      gap: 8px;
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .panel-row span:first-child { flex-shrink: 0; width: 20px; }
    .panel-row a { color: #1a6bbf; text-decoration: none; }
    .panel-row a:hover { text-decoration: underline; }

    .panel-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .panel-badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: #f0f0f0;
      color: #888;
    }
    .panel-badge.active {
      background: #1a2b4a;
      color: #fff;
    }

    #detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 1999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #detail-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

<div id="topbar">
  <h1>🏢 Unternehmenskarte</h1>

  <input type="text" id="search-input" placeholder="Suche in allen Feldern…" />

  <select id="filter-branche" class="filter-select">
    <option value="">Alle Branchen</option>
  </select>

  <select id="filter-standort" class="filter-select">
    <option value="">Alle Standorte</option>
  </select>

  <div class="badge-filter-wrap">
    <button id="badge-filter-btn">Möglichkeiten ▾</button>
    <div id="badge-filter-dropdown">
      <div class="badge-filter-toggle">
        <span>Kombination</span>
        <div class="badge-filter-toggle-btn">
          <button id="badge-mode-or" class="active" data-mode="or">ODER</button>
          <button id="badge-mode-and" data-mode="and">UND</button>
        </div>
      </div>
      <div id="badge-filter-options"></div>
    </div>
  </div>

  <button id="reset-btn">✕ Zurücksetzen</button>
  <span id="result-count"></span>
</div>

<div id="map"></div>

<div id="detail-overlay"></div>
<div id="detail-panel">
  <button class="panel-close" id="panel-close">✕</button>
  <div id="panel-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ──────────────────────────────────────────
  //  👉 HIER SUPABASE-INFOS
  // ──────────────────────────────────────────
  const SUPABASE_URL = "https://gmvodditiwpjlmjvrvec.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtdm9kZGl0aXdwamxtanZydmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1OTMxMzUsImV4cCI6MjA5NzE2OTEzNX0.DeZ-S9xsehxaYSzRnDMqSKAVaNp38xzYJg45fqlG6D8";
  // ──────────────────────────────────────────

  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Karte initialisieren
  if (typeof L === 'undefined') {
    console.error("Leaflet (L) wurde nicht geladen! Mögliche Ursachen: Adblocker/Tracking-Schutz blockiert das CDN-Script, oder kein Internetzugriff.");
    alert("Die Kartenbibliothek (Leaflet) konnte nicht geladen werden. Bitte Adblocker für diese Seite deaktivieren und neu laden.");
  }

  const map = L.map('map').setView([48.56, 13.43], 9);
  // ── Kartenstile zur Auswahl ──
  const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  });

  const voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  });

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  });

  voyagerLayer.addTo(map);

  L.control.layers({
    'Voyager (bunt)': voyagerLayer,
    'Positron (hell)': lightLayer,
    'Standard OSM': osmLayer,
  }).addTo(map);

  // Platzhalter-Koordinaten (keine echten Standorte)
  const PLACEHOLDER_LAT = 51.4323195;
  const PLACEHOLDER_LNG = 6.7707424;

  let allData = [];
  let activeMarkers = [];

  // ── Hilfsfunktion: URL normalisieren ──
  function normalizeUrl(url) {
    if (!url) return null;
    return url.startsWith('http') ? url : 'https://' + url;
  }

  // ── Hilfsfunktion: "X" in Badge-Status umwandeln ──
  function isMarked(value) {
    return !!(value && String(value).trim().toUpperCase() === 'X');
  }

  // ── Badge-Definitionen (Spalte → Anzeigename) ──
  const BADGE_FIELDS = [
    { key: 'Messe DEG',              label: 'Messe DEG' },
    { key: 'Messe ECRI',             label: 'Messe ECRI' },
    { key: 'Praktika ECRI',          label: 'Praktika' },
    { key: 'Projekte \nX\nGastvort. (X)', label: 'Projekte/Gastvortrag' },
    { key: 'BA-/MA-Thesis',          label: 'BA-/MA-Thesis' },
    { key: 'Duales Studium',         label: 'Duales Studium' },
    { key: 'Auslandseinsatz',        label: 'Auslandseinsatz' },
  ];

  function buildBadges(c, cssClass) {
    const active = BADGE_FIELDS.filter(f => isMarked(c[f.key]));
    if (active.length === 0) {
      return `<span class="${cssClass}">Keine Angaben</span>`;
    }
    return active.map(f =>
      `<span class="${cssClass} active">✓ ${f.label}</span>`
    ).join('');
  }

  // ── Kompaktes Popup (Basis-Infos) ──
  function buildPopup(c, index) {
    return `
      <div class="popup-inner">
        <div class="popup-name">${c['Unternehmen'] ?? ''}</div>
        ${c['Branche'] ? `<span class="popup-branche">${c['Branche']}</span>` : ''}
        ${(c['Adresse'] || c['Standorte']) ? `<div class="popup-row"><span>📍</span><span>${c['Adresse'] ?? c['Standorte']}</span></div>` : ''}
        ${c['Telefon'] ? `<div class="popup-row"><span>📞</span><span>${c['Telefon']}</span></div>` : ''}
        <div class="popup-badges">${buildBadges(c, 'popup-badge')}</div>
        <button class="popup-more-btn" onclick="openDetailPanel(${index})">Mehr anzeigen</button>
      </div>
    `;
  }

  // ── Ausführliches Detail-Panel ──
  function buildPanel(c) {
    const website = c['Webseite']
      ? `<a href="${normalizeUrl(c['Webseite'])}" target="_blank">${c['Webseite']}</a>`
      : null;
    const email = c['EMail']
      ? `<a href="mailto:${c['EMail']}">${c['EMail']}</a>`
      : null;

    return `
      <div class="panel-name">${c['Unternehmen'] ?? ''}</div>
      ${c['Branche'] ? `<span class="panel-branche">${c['Branche']}</span>` : ''}

      <div class="panel-section">
        <h3>Kontakt</h3>
        ${(c['Adresse'] || c['Standorte']) ? `<div class="panel-row"><span>📍</span><span>${c['Adresse'] ?? c['Standorte']}</span></div>` : ''}
        ${c['Telefon'] ? `<div class="panel-row"><span>📞</span><span>${c['Telefon']}</span></div>` : ''}
        ${email ? `<div class="panel-row"><span>✉️</span><span>${email}</span></div>` : ''}
        ${website ? `<div class="panel-row"><span>🌐</span><span>${website}</span></div>` : ''}
        ${c['Kontaktperson'] ? `<div class="panel-row"><span>👤</span><span>${c['Kontaktperson']}</span></div>` : ''}
        ${c['Erreichbarkeit'] ? `<div class="panel-row"><span>📶</span><span>${c['Erreichbarkeit']}</span></div>` : ''}
      </div>

      ${c['Standorte'] ? `
      <div class="panel-section">
        <h3>Standorte</h3>
        <div class="panel-row"><span>🏢</span><span>${c['Standorte']}</span></div>
      </div>` : ''}

      ${(c['Gesuchte Fachbereiche und Studiengänge'] || c['MA']) ? `
      <div class="panel-section">
        <h3>Gesuchte Fachbereiche</h3>
        ${c['Gesuchte Fachbereiche und Studiengänge'] ? `<div class="panel-row"><span>🎓</span><span>${c['Gesuchte Fachbereiche und Studiengänge']}</span></div>` : ''}
        ${c['MA'] ? `<div class="panel-row"><span>👥</span><span>${c['MA']} Mitarbeitende</span></div>` : ''}
      </div>` : ''}

      <div class="panel-section">
        <h3>Möglichkeiten</h3>
        <div class="panel-badges">${buildBadges(c, 'panel-badge')}</div>
      </div>

      ${c['Kontakt / eigene Suche'] ? `
      <div class="panel-section">
        <h3>Notizen</h3>
        <div class="panel-row"><span>📝</span><span>${c['Kontakt / eigene Suche']}</span></div>
      </div>` : ''}
    `;
  }

  // ── Detail-Panel öffnen/schließen ──
  window.openDetailPanel = function(index) {
    const c = allData[index];
    document.getElementById('panel-content').innerHTML = buildPanel(c);
    document.getElementById('detail-panel').classList.add('open');
    document.getElementById('detail-overlay').classList.add('open');
  };

  function closeDetailPanel() {
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('detail-overlay').classList.remove('open');
  }

  document.getElementById('panel-close').addEventListener('click', closeDetailPanel);
  document.getElementById('detail-overlay').addEventListener('click', closeDetailPanel);

  // ── Volltextsuche: alle Felder prüfen ──
  function matchesSearch(c, query) {
    if (!query) return true;
    const q = query.toLowerCase();
    return Object.values(c).some(val => val && String(val).toLowerCase().includes(q));
  }

  // ── Badge-Filter Status ──
  let badgeFilterMode = 'or';        // 'or' oder 'and'
  let selectedBadgeKeys = new Set(); // ausgewählte BADGE_FIELDS keys

  function matchesBadgeFilter(c) {
    if (selectedBadgeKeys.size === 0) return true;
    const keys = [...selectedBadgeKeys];
    if (badgeFilterMode === 'and') {
      return keys.every(key => isMarked(c[key]));
    }
    return keys.some(key => isMarked(c[key]));
  }

  // ── Marker rendern ──
  function renderMarkers() {
    const query    = document.getElementById('search-input').value.trim();
    const branche  = document.getElementById('filter-branche').value;
    const standort = document.getElementById('filter-standort').value;

    // Alte Marker entfernen
    activeMarkers.forEach(m => map.removeLayer(m));
    activeMarkers = [];

    allData.forEach((c, index) => {
      if (!matchesSearch(c, query)) return;
      if (branche  && c['Branche']   !== branche)  return;
      if (standort && c['Standorte'] !== standort) return;
      if (!matchesBadgeFilter(c)) return;

      const lat = parseFloat(c.latitude);
      const lng = parseFloat(c.longitude);
      if (isNaN(lat) || isNaN(lng)) return;
      if (lat === PLACEHOLDER_LAT && lng === PLACEHOLDER_LNG) return;

      const marker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup(buildPopup(c, index), { maxWidth: 300 });
      activeMarkers.push(marker);
    });

    document.getElementById('result-count').textContent =
      `${activeMarkers.length} Unternehmen`;
  }

  // ── Badge-Filter-Dropdown befüllen ──
  function populateBadgeFilterOptions() {
    const container = document.getElementById('badge-filter-options');
    container.innerHTML = BADGE_FIELDS.map(f => `
      <label class="badge-filter-option">
        <input type="checkbox" value="${f.key}">
        <span>${f.label}</span>
      </label>
    `).join('');

    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) {
          selectedBadgeKeys.add(cb.value);
        } else {
          selectedBadgeKeys.delete(cb.value);
        }
        updateBadgeFilterButtonState();
        renderMarkers();
      });
    });
  }

  function updateBadgeFilterButtonState() {
    const btn = document.getElementById('badge-filter-btn');
    const count = selectedBadgeKeys.size;
    btn.textContent = count > 0 ? `Möglichkeiten (${count}) ▾` : 'Möglichkeiten ▾';
    btn.classList.toggle('has-selection', count > 0);
  }

  // ── Badge-Filter-Dropdown öffnen/schließen ──
  document.getElementById('badge-filter-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('badge-filter-dropdown').classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.badge-filter-wrap');
    if (!wrap.contains(e.target)) {
      document.getElementById('badge-filter-dropdown').classList.remove('open');
    }
  });

  // ── UND/ODER Toggle ──
  document.getElementById('badge-mode-or').addEventListener('click', () => {
    badgeFilterMode = 'or';
    document.getElementById('badge-mode-or').classList.add('active');
    document.getElementById('badge-mode-and').classList.remove('active');
    renderMarkers();
  });

  document.getElementById('badge-mode-and').addEventListener('click', () => {
    badgeFilterMode = 'and';
    document.getElementById('badge-mode-and').classList.add('active');
    document.getElementById('badge-mode-or').classList.remove('active');
    renderMarkers();
  });

  // ── Dropdowns befüllen ──
  function populateDropdowns(data) {
    const branchen  = [...new Set(data.map(c => c['Branche']).filter(Boolean))].sort();
    const standorte = [...new Set(data.map(c => c['Standorte']).filter(Boolean))].sort();

    const bSelect = document.getElementById('filter-branche');
    branchen.forEach(b => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = b;
      bSelect.appendChild(opt);
    });

    const sSelect = document.getElementById('filter-standort');
    standorte.forEach(s => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = s;
      sSelect.appendChild(opt);
    });

    populateBadgeFilterOptions();
  }

  // ── Daten laden ──
  async function loadCompanies() {
    const { data, error } = await db.from('Unternehmen_neu').select('*');

    if (error) {
      console.error("Supabase Fehler:", error.message);
      alert("Fehler beim Laden: " + error.message);
      return;
    }

    allData = data;
    populateDropdowns(data);
    renderMarkers();
  }

  // ── Event Listener ──
  document.getElementById('search-input') .addEventListener('input',  renderMarkers);
  document.getElementById('filter-branche') .addEventListener('change', renderMarkers);
  document.getElementById('filter-standort').addEventListener('change', renderMarkers);

  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    document.getElementById('filter-branche').value  = '';
    document.getElementById('filter-standort').value = '';
    selectedBadgeKeys.clear();
    document.querySelectorAll('#badge-filter-options input[type="checkbox"]').forEach(cb => cb.checked = false);
    updateBadgeFilterButtonState();
    badgeFilterMode = 'or';
    document.getElementById('badge-mode-or').classList.add('active');
    document.getElementById('badge-mode-and').classList.remove('active');
    renderMarkers();
  });

  loadCompanies();
</script>
</body>
</html>
