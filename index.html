<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Unternehmenskarte</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // ✅ DEINE DATEN HIER EINTRAGEN
  const SUPABASE_URL = "https://DEIN-PROJEKT.supabase.co";
  const SUPABASE_KEY = "DEIN-ANON-KEY";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ✅ Karte initialisieren
  const map = L.map('map').setView([48.56, 13.43], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // ✅ Daten laden + Marker setzen
  async function loadCompanies() {
    const { data, error } = await supabase
      .from('unternehmen')
      .select('*');

    if (error) {
      console.error(error);
      alert("Fehler beim Laden der Daten");
      return;
    }

    data.forEach(company => {
      if (company.latitude && company.longitude) {

        L.marker([company.latitude, company.longitude])
          .addTo(map)
          .bindPopup(`
            <b>${company.name}</b><br><br>
            <b>Branche:</b> ${company.branche || '-'}<br>
            <b>Standorte:</b> ${company.standorte || '-'}<br>
            <b>Fachbereiche:</b> ${company.fachbereiche || '-'}<br><br>
            <a href="https://${company.website}" target="_blankipt>

</body>
</html>
